<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelpHub AI Workspace</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: #f8fafc;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 250px;
  background: #111827;
  padding: 20px;
  border-right: 1px solid #263244;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 30px;
}

.new-chat, .tool, .theme {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #1e293b;
  color: white;
  cursor: pointer;
  text-align: left;
}

.new-chat:hover, .tool:hover, .theme:hover {
  background: #334155;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  padding: 18px;
  border-bottom: 1px solid #263244;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.welcome {
  text-align: center;
  margin: 12vh auto 30px;
  max-width: 600px;
}

.welcome h1 {
  font-size: clamp(25px, 5vw, 38px);
  margin-bottom: 12px;
}

.welcome p {
  color: #94a3b8;
  line-height: 1.6;
}

.message {
  max-width: 750px;
  margin: 12px auto;
  padding: 14px 17px;
  border-radius: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.user {
  background: #263449;
}

.assistant {
  background: #111827;
  border: 1px solid #263244;
}

.composer {
  width: min(850px, 94%);
  margin: 0 auto 20px;
  border: 1px solid #475569;
  border-radius: 18px;
  padding: 12px;
  background: #111827;
}

#prompt {
  width: 100%;
  min-height: 55px;
  max-height: 150px;
  resize: vertical;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 8px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.controls button, .controls label {
  background: #263449;
  border: none;
  color: white;
  padding: 10px 13px;
  border-radius: 10px;
  cursor: pointer;
}

.controls .send {
  margin-left: auto;
  background: #2563eb;
}

#file {
  display: none;
}

#fileName {
  color: #94a3b8;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.disclaimer {
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  padding: 0 10px 12px;
}

body.light {
  background: #f1f5f9;
  color: #0f172a;
}

body.light .main,
body.light .messages {
  background: #f1f5f9;
}

body.light .sidebar,
body.light .header,
body.light .composer,
body.light .assistant {
  background: white;
  color: #0f172a;
}

body.light #prompt {
  color: #0f172a;
}

body.light .tool,
body.light .new-chat,
body.light .theme,
body.light .controls button,
body.light .controls label {
  background: #e2e8f0;
  color: #0f172a;
}

@media (max-width: 650px) {
  .sidebar {
    width: 68px;
    padding: 10px 6px;
  }

  .logo {
    font-size: 12px;
    text-align: center;
    overflow-wrap: anywhere;
  }

  .new-chat, .tool, .theme {
    padding: 10px 3px;
    text-align: center;
    font-size: 11px;
  }

  .messages {
    padding: 12px 8px;
  }

  .header {
    padding: 14px 10px;
  }

  .welcome {
    margin-top: 8vh;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">✨ HelpHub AI</div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <button class="tool" onclick="chooseTool('AI Chat')">💬 Chat</button>
    <button class="tool" onclick="chooseTool('AI Image Generator')">🎨 Images</button>
    <button class="tool" onclick="chooseTool('AI Video Generator')">🎬 Videos</button>
    <button class="tool" onclick="chooseTool('AI Code Assistant')">💻 Coding</button>
    <button class="tool" onclick="chooseTool('AI Writing Assistant')">📝 Writing</button>
    <button class="tool" onclick="chooseTool('Image to Text')">📄 Image to Text</button>

    <button class="theme" onclick="toggleTheme()">🌙 / ☀️ Theme</button>
  </aside>

  <main class="main">
    <header class="header">
      <strong id="currentTool">HelpHub AI Workspace</strong>
      <span>PRO ✨</span>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>What can I help you with?</h1>
        <p>Ask a question, explore tools, or start a new project.</p>
        <p>Roman Urdu • Urdu • English</p>
      </div>
    </section>

    <form class="composer" id="chatForm">
      <textarea id="prompt" placeholder="Message HelpHub AI..." required></textarea>

      <div class="controls">
        <label for="file">＋ Attach</label>
        <input type="file" id="file" accept="image/*,.pdf,.txt,.doc,.docx">
        <span id="fileName"></span>
        <button type="button" onclick="document.getElementById('prompt').value += ' Please answer in Roman Urdu.'">Roman Urdu</button>
        <button class="send" type="submit">➤ Send</button>
      </div>
    </form>

    <div class="disclaimer">
      AI features such as chat, image and video generation require their respective engines.
    </div>
  </main>
</div>

<script>
const form = document.getElementById("chatForm");
const promptBox = document.getElementById("prompt");
const messages = document.getElementById("messages");
const fileInput = document.getElementById("file");
const fileName = document.getElementById("fileName");

let selectedTool = "AI Chat";

function chooseTool(tool) {
  selectedTool = tool;
  document.getElementById("currentTool").textContent = tool;
  promptBox.placeholder = "Ask about " + tool + "...";
  promptBox.focus();
}

function newChat() {
  messages.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>What can I help you with?</h1>
      <p>Ask a question, explore tools, or start a new project.</p>
      <p>Roman Urdu • Urdu • English</p>
    </div>`;
  promptBox.value = "";
  chooseTool("AI Chat");
}

function toggleTheme() {
  document.body.classList.toggle("light");
}

fileInput.addEventListener("change", () => {
  fileName.textContent = fileInput.files.length
    ? "📎 " + fileInput.files[0].name
    : "";
});

function addMessage(text, type) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const question = promptBox.value.trim();
  if (!question) return;

  addMessage(question, "user");
  promptBox.value = "";

  addMessage(
    "Yeh interface abhi demo mode mein hai. Asal AI jawab ke liye AI backend connect karna hoga.",
    "assistant"
  );
});

promptBox.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
